name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          check-latest: true

      - name: test
        run: |
          python3 -m unittest discover -s test/install -v
          go test -race -shuffle=on ./...
          go vet ./...

      - name: install published release
        run: |
          install_dir="$RUNNER_TEMP/gitsail-bin"
          ./install.sh v1.0.0 "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/gitsail" --version

      - name: exercise installed release
        run: test/release/smoke.sh "$RUNNER_TEMP/gitsail-bin/gitsail" "$RUNNER_TEMP/gitsail-smoke"
